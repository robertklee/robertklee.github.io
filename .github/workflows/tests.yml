name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Syntax, unit, and build tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: npm run check:production
      - name: Run all Node.js tests
        run: node --test tests/*.test.js

  browser-tests:
    name: Production Chromium browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browsers and system dependencies
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run browser tests
        run: npx playwright test --config=tests '\.spec\.js$' --workers=1 --forbid-only --reporter=github --trace=retain-on-failure
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
